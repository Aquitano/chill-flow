[package]
name = "chill-catalog"
version = "0.1.0"
edition = "2024"
description = "Adds tracks and ambient sounds to the chill catalog and publishes it to R2"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
anyhow.workspace = true
catalog-schema = { path = "../../crates/catalog-schema" }
clap.workspace = true
dotenvy = "0.15.7"
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto"] }
serde_json.workspace = true
tempfile = "3.27.0"
ureq.workspace = true
url = "2.5.8"
