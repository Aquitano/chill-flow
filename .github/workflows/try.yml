name: Try

# Builds chill the way a release does, without publishing anything, so a change can be tried on a
# Mac or a Windows machine first. It runs on demand only: for a pull request labeled "try" (again on
# each push while the label stays), or for any branch with `gh workflow run try.yml -r <branch>`.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: try-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'try')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --locked
      # A tarball keeps the binary executable, which an artifact's zip would not.
      - if: runner.os == 'macOS'
        run: tar -czf chill.tar.gz -C target/dist chill
      - uses: actions/upload-artifact@v7
        with:
          name: chill-${{ matrix.target }}
          path: ${{ runner.os == 'macOS' && 'chill.tar.gz' || 'target/dist/chill.exe' }}
          retention-days: 14

  # Leaves one comment on the pull request with the downloads and the commands to run them, and
  # edits it for every later build rather than adding another.
  comment:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          artifact() {
            gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq ".artifacts[] | select(.name == \"$1\") | .$2"
          }
          url="https://github.com/$REPO/actions/runs/$RUN"
          mac="$url/artifacts/$(artifact chill-aarch64-apple-darwin id)"
          windows="$url/artifacts/$(artifact chill-x86_64-pc-windows-msvc id)"
          expires=$(date -d "$(artifact chill-aarch64-apple-darwin expires_at)" +%Y-%m-%d)
          cat > body.md <<'BODY'
          <!-- chill-try -->
          ### Try this build

          Built from @SHA@ in [run @RUN@](@URL@). The downloads are kept until @EXPIRES@.

          **macOS** (Apple Silicon), [download](@MAC@):

          ```bash
          gh run download @RUN@ -R @REPO@ -n chill-aarch64-apple-darwin -D /tmp/chill-try-@RUN@ && tar -xzf /tmp/chill-try-@RUN@/chill.tar.gz -C /tmp/chill-try-@RUN@ && XDG_CONFIG_HOME="$HOME/.config/chill-try" /tmp/chill-try-@RUN@/chill
          ```

          **Windows**, [download](@WINDOWS@), in PowerShell:

          ```powershell
          gh run download @RUN@ -R @REPO@ -n chill-x86_64-pc-windows-msvc -D "$env:TEMP\chill-try-@RUN@"; $installed = $env:APPDATA; $env:APPDATA = "$env:LOCALAPPDATA\chill-try"; & "$env:TEMP\chill-try-@RUN@\chill.exe"; $env:APPDATA = $installed
          ```

          Both keep the build's settings apart from the installed chill's, since an older chill won't start with settings a newer one has written. On macOS they go in `~/.config/chill-try`, and the library and cache are shared. On Windows chill keeps its settings and library in the same folder, so the build gets both of its own in `%LOCALAPPDATA%\chill-try`.
          BODY
          sed -i -e "s|@RUN@|$RUN|g" -e "s|@REPO@|$REPO|g" -e "s|@SHA@|${SHA:0:7}|g" \
            -e "s|@URL@|$url|g" -e "s|@MAC@|$mac|g" -e "s|@WINDOWS@|$windows|g" -e "s|@EXPIRES@|$expires|g" body.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- chill-try -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
