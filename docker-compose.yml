services:
    app:
        image: ghcr.io/aquitano/chill-flow:latest
        # Build locally instead of pulling with: docker compose build
        build:
            context: .
        restart: unless-stopped
        env_file: .env
        # Loopback-only: the tunnel (or a local reverse proxy) is the sole entrypoint, so the
        # container is never reachable from the public internet directly.
        ports:
            - '127.0.0.1:3000:3000'
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

    # Opt-in: docker compose --profile tunnel up -d
    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        profiles:
            - tunnel
        command: tunnel --no-autoupdate run
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
        depends_on:
            app:
                condition: service_healthy
