[package]
name = "chill"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossterm = "0.29.0"
etcetera = "0.11.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.38"
notify-rust = "4.18.2"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
realfft = "3.5.0"
rtrb = "0.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
toml = "1.1.8"
ureq = "3.4.2"
