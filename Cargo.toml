[package]
name = "chill"
version = "0.3.0"
edition = "2024"
description = "Lo-fi, ambience, and a focus timer in your terminal"
license = "Apache-2.0"
repository = "https://github.com/Aquitano/chill-flow"

[workspace]
members = ["crates/catalog-schema", "tools/catalog"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"

[dependencies]
anyhow.workspace = true
axoupdater = "0.10.3"
catalog-schema = { path = "crates/catalog-schema" }
clap.workspace = true
cpal = "0.18.2"
crossterm = { version = "0.29.0", features = ["osc52"] }
etcetera = "0.11.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.38"
notify-rust = "4.18.2"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
realfft = "3.5.0"
rtrb = "0.4.0"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6.1", features = ["all"] }
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"
ureq.workspace = true
which = "8.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
signal-hook = "0.3.18"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
